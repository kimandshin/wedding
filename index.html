<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wedding Invitation – 김유석 🤍 신혜수</title>

<style>
@font-face {
  font-family: 'Samanco';
  src: url('BinggraeSamanco.otf') format('opentype');
}
body {
  font-family: 'Samanco', system-ui, sans-serif;
  margin: 0;
  padding: 40px 10px 60px;
  background: #f5f2ee;
  color: #333;
  text-align: center;
}
.container {
  max-width: 760px;
  margin: 0 auto;
  background: #fff;
  padding: 40px 26px 60px;
  border-radius: 18px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.08);
}
.btn {
  padding: 9px 16px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: #fafafa;
  margin: 6px;
  font-size: 0.85rem;
}
.btn-primary {
  border-color: #000;
  font-weight: 600;
}
.section-title {
  font-size: 1.25rem;
  margin: 32px 0 10px;
  font-weight: 600;
}
#messageCarousel {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 10px 5px;
}
.falling-flower {
  position: fixed;
  font-size: 32px;
  user-select: none;
  cursor: pointer;
  z-index: 5;
}
#scoreboardWrapper {
  display: none;
  margin-top: 20px;
}
.collapsible {
  background: #fafafa; border:1px solid #ddd;
  border-radius:10px; padding:10px 14px;
  cursor:pointer; width:200px; margin:10px auto;
  font-size:0.9rem;
}
.collapsible-content {
  overflow:hidden; max-height:0; padding:0;
  transition:max-height 0.3s ease;
}
</style>

<script>
/* ---------- LANGUAGE ---------- */
function switchLang(lang){
  document.querySelectorAll("[data-en][data-ko]").forEach(el=>{
    el.innerHTML = (lang==="ko") ? el.dataset.ko : el.dataset.en;
  });
}

/* ---------- BGM ---------- */
let bgm;
function toggleBGM(){
  if(!bgm){
    bgm = new Audio("hymn.mp3");
    bgm.loop = true;
    bgm.play().catch(()=>{});
    document.getElementById("bgmBtn").innerText="♪ Pause BGM";
  } else if(bgm.paused){
    bgm.play(); document.getElementById("bgmBtn").innerText="♪ Pause BGM";
  } else {
    bgm.pause(); document.getElementById("bgmBtn").innerText="♪ Play BGM";
  }
}

/* ---------- FLOWERS ---------- */
let flowerCount=0, activeFlowers=0, maxFlowers=4;

function spawnFlower(){
  if(activeFlowers>=maxFlowers) return;

  const f=document.createElement("div");
  f.className="falling-flower";
  f.textContent="🪻";
  f.style.left=Math.random()*80+10+"vw";
  f.style.top="-30px";

  document.body.appendChild(f);
  activeFlowers++;

  const fallMs=8000+Math.random()*5000;
  f.animate([
    {transform:"translateY(0)",opacity:0},
    {transform:"translateY(40vh)",opacity:1},
    {transform:"translateY(85vh)",opacity:0}
  ],{duration:fallMs,easing:"linear"});

  f.onclick=()=>{
    flowerCount++;
    activeFlowers--;
    f.remove();
    document.getElementById("flowerCounter").innerText=flowerCount;
  };

  setTimeout(()=>{
    if(f.parentNode){ activeFlowers--; f.remove(); }
  }, fallMs+300);

  setTimeout(spawnFlower, 1000+Math.random()*4000);
}

document.addEventListener("DOMContentLoaded",()=>{ spawnFlower(); loadMessages(); loadScoreboard(); });

/* ---------- GOOGLE SCRIPT ENDPOINT ---------- */
const API = "https://script.google.com/macros/s/AKfycbx6rTcXAYVXu7V4_eaTjPSFvvzKRIXwaVgnlug3MWG2O4a395rGAZE8saJdr08hJzAl/exec";

/* ---------- SUBMIT MESSAGE ---------- */
function submitMessage(){
  const name=guestName.value.trim();
  const msg=guestMsg.value.trim();
  const status=msgStatus;

  if(!name||!msg){
    status.style.color="red";
    status.innerText="Please enter both your name and a message.";
    return;
  }
  status.style.color="#444";
  status.innerText="Submitting...";

  fetch(`${API}?action=addMessage&name=${encodeURIComponent(name)}&message=${encodeURIComponent(msg)}`)
  .then(()=>{ 
    status.style.color="green";
    status.innerText="Thank you! Your message has been added!";
    guestName.value=""; guestMsg.value="";
    loadMessages();
  })
  .catch(()=>{
    status.style.color="red";
    status.innerText="Error: Please try again.";
  });
}

/* ---------- LOAD MESSAGES ---------- */
function loadMessages(){
  fetch(`${API}?action=getMessages`)
    .then(r=>r.json())
    .then(rows=>{
      messageCarousel.innerHTML="";
      rows.forEach(r=>{
        const card=document.createElement("div");
        card.style.minWidth="180px";
        card.style.maxWidth="220px";
        card.style.padding="14px";
        card.style.border="1px solid #ddd";
        card.style.borderRadius="12px";
        card.style.background="#fafafa";
        card.style.scrollSnapAlign="center";
        card.innerHTML=`<strong>${r.name}</strong><br><br>${r.message}`;
        messageCarousel.appendChild(card);
      });
    });
}

/* ---------- SUBMIT SCORE ---------- */
function submitScore(){
  const name=scoreName.value.trim();
  const status=scoreStatus;

  if(!name){
    status.style.color="red";
    status.innerText="Please enter your name.";
    return;
  }
  status.style.color="#444";
  status.innerText="Submitting...";

  fetch(`${API}?action=addFlower&name=${encodeURIComponent(name)}&count=${encodeURIComponent(flowerCount)}`)
    .then(()=>{
      status.style.color="green";
      status.innerText="Score submitted!";
      loadScoreboard();
    })
    .catch(()=>{
      status.style.color="red";
      status.innerText="Error submitting score.";
    });
}

/* ---------- LOAD SCOREBOARD ---------- */
function loadScoreboard(){
  fetch(`${API}?action=getFlowers`)
    .then(r=>r.json())
    .then(rows=>{
      scoreboardArea.innerHTML="";
      if(rows.length===0){
        scoreboardArea.innerHTML="<p>No scores yet.</p>";
        return;
      }
      rows.forEach(r=>{
        const p=document.createElement("p");
        p.innerHTML=`<strong>${r.name}</strong> — ${r.total}`;
        scoreboardArea.appendChild(p);
      });
    });
}

/* ---------- COLLAPSIBLE ---------- */
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".collapsible").forEach(btn=>{
    btn.addEventListener("click",()=>{
      btn.classList.toggle("active");
      const content=btn.nextElementSibling;
      content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight+"px";
    });
  });
});

/* ---------- TROPHY BUTTON ---------- */
function toggleScoreboard(){
  const wrap=document.getElementById("scoreboardWrapper");
  wrap.style.display = wrap.style.display==="none" ? "block" : "none";
}
</script>
</head>

<body>

<div class="container">

  <button class="btn" onclick="switchLang('en')">ENG</button>
  <button class="btn" onclick="switchLang('ko')">KOR</button>
  <button id="bgmBtn" class="btn" onclick="toggleBGM()">♪ Play BGM</button>

  <h1>WEDDING INVITATION</h1>
  <h2>김유석 🤍 신혜수</h2>

  <img src="hyesoo_david.png" class="wedding-img" />

  <hr>

  <div class="section-title" data-en="Leave a Message" data-ko="축하 메시지 남겨주세요">
    Leave a Message
  </div>

  <input id="guestName" placeholder="Your Name" style="width:100%; padding:10px; margin:10px 0;" />
  <textarea id="guestMsg" placeholder="Write your message" style="width:100%; height:90px; padding:10px;"></textarea>
  <button class="btn btn-primary" onclick="submitMessage()">Submit</button>
  <div id="msgStatus" style="margin-top:10px;"></div>

  <hr>

  <div class="section-title">Messages</div>
  <div id="messageCarousel"></div>

  <hr>

  <button id="trophyBtn" class="btn" onclick="toggleScoreboard()">🏆 Scoreboard</button>

  <div id="scoreboardWrapper">

    <p>Flowers collected: <strong id="flowerCounter">0</strong></p>

    <button class="collapsible">See Scoreboard</button>
    <div class="collapsible-content" id="scoreboardArea">
      <p>Loading scoreboard...</p>
    </div>

    <div style="margin-top:20px;">
      <input id="scoreName" placeholder="Your Name" style="padding:10px; width:200px;" />
      <button class="btn btn-primary" onclick="submitScore()">Submit Score</button>
      <div id="scoreStatus" style="margin-top:10px;"></div>
    </div>

  </div>

</div>

</body>
</html>
